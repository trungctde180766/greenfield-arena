<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenField - Đặt Sân Thể Thao</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #34d399;
            --bg-grad-1: #064e3b;
            --bg-grad-2: #022c22;
            --text-light: #ecfdf5;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Animated Background Elements */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            animation: float 10s infinite ease-in-out alternate;
        }
        .circle-1 { top: -10%; left: -10%; width: 500px; height: 500px; opacity: 0.4; }
        .circle-2 { bottom: -20%; right: -10%; width: 600px; height: 600px; opacity: 0.3; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
            min-height: 100vh;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                text-align: center;
            }
        }

        .hero-text h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(to right, #6ee7b7, #34d399, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: slideUp 0.8s ease-out;
        }

        .hero-text p {
            font-size: 1.2rem;
            color: #a7f3d0;
            margin-bottom: 30px;
            animation: slideUp 1s ease-out;
        }

        .features {
            display: flex;
            gap: 15px;
            animation: slideUp 1.2s ease-out;
        }

        .features span {
            background: var(--glass-bg);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        @media (max-width: 900px) {
            .features { justify-content: center; flex-wrap: wrap; }
        }

        /* Glassmorphism Booking Card */
        .booking-card {
            background: rgba(16, 185, 129, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInScale 1s ease-out;
        }

        .booking-card h2 {
            font-size: 2rem;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #d1fae5;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            background: rgba(0, 0, 0, 0.3);
        }

        .form-control option {
            background: var(--bg-grad-2);
            color: white;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Success Message */
        .success-msg {
            display: none;
            text-align: center;
            padding: 20px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--primary);
            border-radius: 12px;
            margin-top: 20px;
            animation: slideUp 0.5s ease-out;
        }

        /* Top K8s Badge */
        .k8s-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 20;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <div class="k8s-badge">
        <div class="status-dot"></div>
        Running on Amazon EKS (Production Grade)
    </div>

    <div class="container">
        <!-- Text Section -->
        <div class="hero-text">
            <h1>GreenField<br>Arena</h1>
            <p>Hệ thống đặt sân thể thao đẳng cấp. Nhanh chóng, tiện lợi, trải nghiệm mượt mà. Đạt chuẩn 1-click Terraform K8s.</p>
            
            <div class="features">
                <span>⚽ Bóng đá</span>
                <span>🎾 Tennis</span>
                <span>🏸 Cầu lông</span>
                <span>🏀 Bóng rổ</span>
            </div>
        </div>

        <!-- Booking Form -->
        <div class="booking-card">
            <h2>Đặt Sân Ngay</h2>
            <form id="bookingForm">
                <div class="form-group">
                    <label>Loại sân</label>
                    <select class="form-control" id="sport" required>
                        <option value="" disabled selected>Chọn môn thể thao...</option>
                        <option value="football">Sân Bóng đá (5-7 người)</option>
                        <option value="tennis">Sân Tennis</option>
                        <option value="badminton">Sân Cầu lông</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Ngày chơi</label>
                    <input type="date" class="form-control" id="date" required>
                </div>

                <div class="form-group">
                    <label>Khung giờ</label>
                    <select class="form-control" id="time" required>
                        <option value="" disabled selected>Chọn khung giờ...</option>
                        <option value="17">17:00 - 18:30 (Giờ vàng)</option>
                        <option value="18">18:30 - 20:00 (Giờ vàng)</option>
                        <option value="20">20:00 - 21:30</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Họ và Tên</label>
                    <input type="text" class="form-control" id="name" placeholder="Nhập tên của bạn" required>
                </div>

                <button type="submit" class="btn-submit">Xác nhận đặt sân</button>
            </form>

            <div id="successMsg" class="success-msg">
                🎉 Đặt sân thành công! Cảm ơn <b><span id="resName"></span></b>.<br> Hẹn gặp bạn tại sân <b><span id="resSport"></span></b>.
            </div>
        </div>
    </div>

    <script>
        // Thiết lập ngày tối thiểu là hôm nay
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;
        dateInput.value = today;

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.querySelector('.btn-submit');
            btn.innerHTML = 'Đang xử lý...';
            btn.style.opacity = '0.7';

            // Mô phỏng việc gửi API
            setTimeout(() => {
                const sportText = document.getElementById('sport').options[document.getElementById('sport').selectedIndex].text;
                const name = document.getElementById('name').value;

                document.getElementById('bookingForm').style.display = 'none';
                document.getElementById('resName').innerText = name;
                document.getElementById('resSport').innerText = sportText;
                document.getElementById('successMsg').style.display = 'block';
            }, 800);
        });
    </script>
</body>
</html>
